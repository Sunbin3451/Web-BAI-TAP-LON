<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Website nghe nhạc trực tuyến đa nền tảng, thiết kế giao diện hiện đại">
    <meta name="keywords"
        content="rap việt, v-pop, vpopmusic, vpop, nghe nhạc, music streaming, playlist, lofi, html5, tailwind css">
    <!-- Cho trình duyệt máy tính (Chrome, Edge, Firefox) -->
    <link rel="icon" type="image/x-icon" href="./assets/img/android-chrome-512x512.png">
    <link rel="icon" type="image/png" sizes="32x32" href="./assets/img/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="./assets/img/favicon-16x16.png">

    <!-- Cho iPhone / iPad (iOS) -->
    <link rel="apple-touch-icon" sizes="180x180" href="./assets/img/apple-touch-icon.png">

    <!-- Cho thiết bị Android -->
    <link rel="manifest" href="./assets/img/site.webmanifest">
    <title>OU Pulse - Nghe Nhạc Trực Tuyến</title>

    <!-- ============ Nhúng file css ============ -->
    <link rel="stylesheet" href="./assets/css/color.css">
    <link rel="stylesheet" href="./assets/css/layout.css">
    <link rel="stylesheet" href="./assets/css/scrollbar.css">
    <link rel="stylesheet" href="./assets/css/theloai.css">
    <link rel="stylesheet" href="./assets/css/search.css">
    <link rel="stylesheet" href="./assets/css/playlist.css">
    <link rel="stylesheet" href="./assets/css/album.css">
    <link rel="stylesheet" href="./assets/css/favorite.css">
    <link rel="stylesheet" href="./assets/css/queue.css">

    <!-- <link rel="stylesheet" href="./assets/css/header.css"> -->

    <!-- ============ Các thư viện ============ -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css"
        integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />

    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body>
    <!-- Header -->
    <div id="header-placeholder"></div>

    <div class="layout-container flex">
        <!-- Sidebar -->
        <div id="sidebar-placeholder"></div>

        <!-- Main Content -->
        <main id="app-content" class="main-container flex">

        </main>
    </div>

    <!-- Music Player & Queue -->
    <div id="player-placeholder"></div>
    <div id="queue-placeholder"></div>

    <!-- Context Menu -->
    <div id="song-context-menu" class="song-ctx-menu hidden">
        <button class="song-ctx-item" data-action="play-now">
            <i class="fa-solid fa-play"></i>
            <span>Phát ngay</span>
        </button>
        <button class="song-ctx-item" data-action="add-queue">
            <i class="fa-solid fa-list-ul"></i>
            <span>Thêm vào hàng đợi</span>
        </button>
        <hr class="song-ctx-divider">
        <button class="song-ctx-item" data-action="add-playlist">
            <i class="fa-regular fa-square-plus"></i>
            <span>Thêm vào playlist</span>
        </button>
    </div>

    <!-- Popup chọn playlist để thêm -->
    <div id="add-to-playlist-modal" class="playlist__modal-overlay hidden">
        <div class="playlist__modal playlist__modal--add">
            <h3 class="playlist__modal-title">Thêm vào playlist</h3>

            <div id="modal-playlist-list" class="playlist__modal-list">

            </div>

            <button id="btn-modal-create-pl" class="playlist__modal-btn-create-new">
                + Tạo playlist mới
            </button>
        </div>
    </div>

    <!-- ============ Nhúng file javascript ============ -->
    <script type="module" src="./assets/javascript/main.js"></script>
    <script type="module" src="./assets/javascript/favorite.js"></script>
    <script type="module" src="./assets/javascript/search.js"></script>
    <script type="module" src="./assets/javascript/theloai.js"></script>
    <script type="module" src="./assets/javascript/playlist.js"></script>
    <script type="module" src="./assets/javascript/music-player.js"></script>
    <script src="./assets/javascript/album.js"></script>
    <script src="./assets/javascript/album-detail.js"></script>
    <script src="./assets/javascript/header-login.js"></script>

</body>

</html>
</body>

</html>
