<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng Nhập - Bài Tập Lớn</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        .login__bg {
            background: #000000;
        }
        .login__title-glow {
            color: #ffffff;
            text-shadow: 0 0 8px rgba(168, 85, 247, 0.9),
                         0 0 20px rgba(168, 85, 247, 0.6),
                         0 0 35px rgba(168, 85, 247, 0.4);
        }
        .login__input:focus {
            outline: none;
            border-color: #d946ef;
            box-shadow: 0 0 0 3px rgba(217, 70, 239, 0.2);
        }
        .login__submit-btn {
            background: linear-gradient(90deg, #a855f7, #ec4899);
        }
        .login__submit-btn:hover {
            opacity: 0.9;
        }
        .login__wave {
            display: flex;
            align-items: flex-end;
            gap: 3px;
            height: 40px;
        }
        .login__wave span {
            width: 3px;
            background: linear-gradient(180deg, #a855f7, #ec4899);
            border-radius: 2px;
            animation: waveMove 1.2s ease-in-out infinite;
        }
        @keyframes waveMove {
            0%, 100% { height: 20%; }
            50% { height: 100%; }
        }
    </style>
</head>

<body class="login__bg min-h-screen flex items-center justify-center relative overflow-hidden p-4">

    <div class="login__card relative z-10 w-full max-w-sm bg-neutral-900/70 backdrop-blur-xl border border-white/10 rounded-3xl p-8 shadow-2xl">

        <div class="login__header flex items-center justify-center gap-2 mb-8">
            <i class="fa-solid fa-music login__title-glow text-xl"></i>
            <h1 class="login__title-glow text-xl font-extrabold tracking-wide">ĐĂNG NHẬP</h1>
        </div>

        <form id="loginForm" class="login__form flex flex-col gap-4">

            <!-- Tên đăng nhập hoặc Email -->
            <div class="login__field relative">
                <input type="text" id="loginUsername" required
                    class="login__input w-full bg-white/5 border border-white/10 rounded-full px-5 py-3 text-sm text-white placeholder-neutral-400 transition"
                    placeholder="Tên đăng nhập hoặc Email">
            </div>

            <!-- Mật khẩu -->
            <div class="login__field relative">
                <input type="password" id="loginPassword" required minlength="6"
                    class="login__input w-full bg-white/5 border border-white/10 rounded-full px-5 py-3 text-sm text-white placeholder-neutral-400 transition"
                    placeholder="Mật khẩu">
            </div>

            <!-- Thông báo lỗi -->
            <p id="loginError" class="login__error text-red-400 text-xs text-center hidden"></p>

            <!-- Nút đăng nhập -->
            <button type="submit"
                class="login__submit-btn w-full text-white font-bold rounded-full py-3 mt-2 text-sm tracking-wide transition">
                Đăng Nhập
            </button>

            <!-- Chuyển sang đăng ký -->
            <p class="text-center text-xs text-neutral-400 mt-1">
                Chưa có tài khoản?
                <a href="register.html" class="text-pink-400 hover:underline">Đăng ký</a>
            </p>
        </form>
    </div>

    <!-- Sóng âm thanh trang trí -->
    <div class="login__wave absolute bottom-6 left-1/2 -translate-x-1/2">
        <span style="animation-delay: 0s"></span>
        <span style="animation-delay: 0.1s"></span>
        <span style="animation-delay: 0.2s"></span>
        <span style="animation-delay: 0.3s"></span>
        <span style="animation-delay: 0.4s"></span>
        <span style="animation-delay: 0.5s"></span>
        <span style="animation-delay: 0.6s"></span>
        <span style="animation-delay: 0.7s"></span>
    </div>

    <script>
        const form = document.getElementById('loginForm');
        const errorEl = document.getElementById('loginError');

        form.addEventListener('submit', (e) => {
            e.preventDefault();
            errorEl.classList.add('hidden');

            const usernameOrEmail = document.getElementById('loginUsername').value.trim();
            const password = document.getElementById('loginPassword').value;

            if (!usernameOrEmail || !password) {
                showError('Vui lòng điền đầy đủ tên đăng nhập/email và mật khẩu.');
                return;
            }

            // TODO: Gọi API đăng nhập thật ở đây khi có endpoint
            // Ví dụ: await fetch(`${BASE_URL}/api/v1/auth/login`, { method: 'POST', body: JSON.stringify({ usernameOrEmail, password }) })

            // Demo: kiểm tra với tài khoản đã "đăng ký" lưu trong localStorage
            let registeredUser = null;
            try {
                registeredUser = JSON.parse(localStorage.getItem('currentUser'));
            } catch (err) {
                registeredUser = null;
            }

            const matched = registeredUser && (
                registeredUser.username === usernameOrEmail ||
                registeredUser.email === usernameOrEmail
            );

            if (!matched) {
                showError('Tên đăng nhập/email hoặc mật khẩu không đúng.');
                return;
            }

            // Demo: đăng nhập thành công, giữ nguyên currentUser đã có
            alert(`Đăng nhập thành công! Chào mừng trở lại, ${registeredUser.username}.`);
            window.location.href = 'index.html';
        });

        function showError(message) {
            errorEl.textContent = message;
            errorEl.classList.remove('hidden');
        }
    </script>
</body>

</html>
