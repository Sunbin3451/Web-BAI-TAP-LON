<footer class="footer-container flex">
    <div class="player-left">
        <div class="album-art-placeholder">
            <i class="fa-solid fa-music"></i>
        </div>
        <div class="song-info">
            <span class="song-title">Chưa phát bài nào</span>
            <span class="song-subtitle">—</span>
        </div>
    </div>

    <!-- Center: Playback Controls & Progress -->
    <div class="player-center">
        <div class="playback-controls">
            <button class="control-btn btn-shuffle" title="Phát ngẫu nhiên"><i class="fa-solid fa-shuffle"></i></button>
            <button class="control-btn step-btn btn-prev" title="Bài trước"><i
                    class="fa-solid fa-backward-step"></i></button>

            <button class="play-btn" title="Phát/Dừng">
                <i class="fa-solid fa-play"></i>
            </button>

            <button class="control-btn step-btn btn-next" title="Bài tiếp theo"><i
                    class="fa-solid fa-forward-step"></i></button>
            <button class="control-btn btn-repeat" title="Lặp lại"><i class="fa-solid fa-repeat"></i></button>
        </div>

        <div class="progress-container">
            <span class="time-text text-right">0:00</span>
            <div class="progress-bar">
                <div class="progress-fill"></div>
            </div>
            <span class="time-text text-left">0:00</span>
        </div>
    </div>

    <!-- Right: Extra Controls & Volume -->
    <div class="player-right">
        <button class="control-btn" title="Danh sách phát"><i class="fa-solid fa-list-ul"></i></button>
        <button class="control-btn btn-volume" title="Âm lượng"><i class="fa-solid fa-volume-high"></i></button>

        <div class="volume-bar">
            <div class="volume-fill"></div>
        </div>
    </div>
</footer>
