<header class="flex items-center justify-end px-8 py-4 bg-[#121212]/90 sticky top-0 z-40 backdrop-blur-md">
    <!-- avatar người dùng mà menu-->
    <div class="relative">
        <!-- nút Avatar -->
        <button id="user-avatar-btn" class="w-8 h-8 rounded-full bg-purple-600 text-white font-semibold flex items-center justify-center hover:scale-105 transition focus:outline-none border-2 border-transparent hover:border-white">
            L
        </button>

        <!-- menu Xổ Xuống -->
        <div id="user-dropdown-menu" class="hidden absolute right-0 mt-2 w-52 bg-[#282828] border border-[#3e3e3e] rounded-lg shadow-2xl py-1 text-sm text-gray-200 z-50">
            <div class="px-4 py-2 border-b border-[#3e3e3e]">
                <p id="user-display-name" class="font-semibold text-white truncate">Lê Văn A</p>
                <p id="user-display-email" class="text-xs text-gray-400 truncate">user@gmail.com</p>
            </div>
            
            <button id="btn-open-settings" class="w-full text-left px-4 py-2.5 hover:bg-[#3e3e3e] flex items-center gap-2 transition">
                <i class="fa-solid fa-gear text-gray-400"></i> Cài đặt tài khoản
            </button>

            <button id="btn-open-forgot" class="w-full text-left px-4 py-2.5 hover:bg-[#3e3e3e] flex items-center gap-2 transition">
                <i class="fa-solid fa-key text-gray-400"></i> Quên mật khẩu
            </button>

            <div class="border-t border-[#3e3e3e] my-1"></div>

            
            <button id="btn-logout" class="w-full text-left px-4 py-2.5 hover:bg-[#3e3e3e] text-red-400 flex items-center gap-2 transition">
                <i class="fa-solid fa-right-from-bracket"></i> Đăng xuất
            </button>
        </div>
    </div>

</header>

<!-- quên mật khẩu-->
<div id="forgot-modal" class="hidden fixed inset-0 bg-black/70 flex items-center justify-center z-50 p-4">
    <div class="bg-[#282828] border border-[#3e3e3e] w-full max-w-md rounded-xl p-6 shadow-2xl text-gray-200 relative">
        <h3 class="text-xl font-bold text-white mb-2">Khôi phục mật khẩu</h3>
        <p class="text-xs text-gray-400 mb-4">Nhập email của bạn để nhận liên kết đặt lại mật khẩu.</p>
        
        <form id="forgot-password-form" class="space-y-4">
            <div>
                <label class="block text-xs font-medium text-gray-400 mb-1">Email đăng ký</label>
                <input type="email" id="forgot-email-input" required placeholder="example@gmail.com" class="w-full px-3 py-2 bg-[#121212] border border-[#3e3e3e] rounded-lg text-white text-sm focus:outline-none focus:border-purple-500" />
            </div>

            <div class="flex justify-end gap-2 pt-2">
                <button type="button" id="btn-close-forgot" class="px-4 py-2 text-sm bg-gray-600 hover:bg-gray-500 text-white rounded-lg transition">Hủy</button>
                <button type="submit" class="px-4 py-2 text-sm bg-purple-600 hover:bg-purple-700 text-white font-medium rounded-lg transition">Gửi yêu cầu</button>
            </div>
        </form>
    </div>
</div>
