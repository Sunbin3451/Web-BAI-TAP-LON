<header class="header-container">

    <div class="header-left"></div>
    <div class="header-center">
        <div class="search-bar">
            <i class="fa-solid fa-magnifying-glass search-icon"></i>
            <input type="text" placeholder="What do you want to play?" class="search-input">
        </div>
    </div>

    <div class="header-right">
        <a href="login.html" id="headerLoginBtn" class="header-login-btn hidden">
            Đăng Nhập
        </a>
        <div class="profile-container" id="headerProfile">
            <div class="profile-avatar-wrapper">
                <button id="user-avatar-btn" class="profile-avatar"></button>
                <div class="status-indicator"></div>
            </div>
            <div id="user-dropdown-menu" class="dropdown-menu hidden">
                <div class="dropdown-header">
                    <p id="user-display-name" class="user-name">
                        Tên Người Dùng
                    </p>
                    <p id="user-display-email" class="user-email">
                        user@gmail.com
                    </p>
                </div>
                <button id="btn-open-settings" type="button" class="dropdown-item">
                    <i class="fa-solid fa-gear dropdown-icon"></i>
                    Cài đặt tài khoản
                </button>
                <button id="btn-open-forgot" type="button" class="dropdown-item">
                    <i class="fa-solid fa-key dropdown-icon"></i>
                    Quên mật khẩu
                </button>
                <div class="dropdown-divider"></div>
                <button id="btn-logout" type="button" class="dropdown-item logout-btn">
                    <i class="fa-solid fa-right-from-bracket dropdown-icon"></i>
                    Đăng xuất
                </button>
            </div>
        </div>
    </div>
</header>

<div id="forgot-modal" class="modal-overlay hidden">
    <div class="modal-card">
        <h3 class="modal-title">
            Khôi phục mật khẩu
        </h3>
        <p class="modal-subtitle">
            Nhập email của bạn để nhận liên kết đặt lại mật khẩu.
        </p>
        <form id="forgot-password-form" class="modal-form">
            <div class="form-group">
                <label class="form-label">
                    Email đăng ký
                </label>
                <input type="email" id="forgot-email-input" required placeholder="example@gmail.com" class="form-input">

            </div>
            <div class="form-actions">
                <button type="button" id="btn-close-forgot" class="btn-secondary">
                    Hủy
                </button>
                <button type="submit" class="btn-primary">
                    Gửi yêu cầu
                </button>
            </div>
        </form>
    </div>
</div>
