<header class="header-container">

    <div class="header-left">
        <a href="index.html" class="header-brand">
            <img src="../assets/img/android-chrome-512x512.png" alt="OU Pulse Logo" class="brand-logo">
            <span class="brand-name">OU Pulse</span>
        </a>
    </div>

    <div class="header-center">
        <div class="search-bar">
            <i class="fa-solid fa-magnifying-glass search-icon"></i>
            <input type="text" placeholder="What do you want to play?" class="search-input">
        </div>
    </div>

    <div class="header-right">
        <a href="login.html" id="headerLoginBtn" class="header-login-btn hidden">
            Đăng Nhập
        </a>
        <div class="profile-container" id="headerProfile">
            <div class="profile-avatar-wrapper">
                <button id="user-avatar-btn" class="profile-avatar"></button>
                <div class="status-indicator"></div>
            </div>
            <div id="user-dropdown-menu" class="dropdown-menu hidden">
                <div class="dropdown-header">
                    <p id="user-display-name" class="user-name">
                        Tên Người Dùng
                    </p>
                    <p id="user-display-email" class="user-email">
                        user@gmail.com
                    </p>
                </div>
                <button id="btn-open-settings" type="button" class="dropdown-item">
                    <i class="fa-solid fa-gear dropdown-icon"></i>
                    Cài đặt tài khoản
                </button>
                <button id="btn-open-forgot" type="button" class="dropdown-item">
                    <i class="fa-solid fa-key dropdown-icon"></i>
                    Quên mật khẩu
                </button>
                <div class="dropdown-divider"></div>
                <button id="btn-logout" type="button" class="dropdown-item logout-btn">
                    <i class="fa-solid fa-right-from-bracket dropdown-icon"></i>
                    Đăng xuất
                </button>
            </div>
        </div>
    </div>
</header>
