<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Website nghe nhạc trực tuyến đa nền tảng, thiết kế giao diện hiện đại">
    <meta name="keywords"
        content="rap việt, v-pop, vpopmusic, vpop, nghe nhạc, music streaming, playlist, lofi, html5">

    <title>Thể Loại - Bài Tập Lớn</title>

    <link rel="stylesheet" href="./assets/css/layout.css">
    <link rel="stylesheet" href="./assets/css/theloai.css">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
        integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body>
    <!-- Header -->
    <div id="header-placeholder"></div>

    <div class="layout-container flex">
        <!-- Sidebar -->
        <div id="sidebar-placeholder"></div>

        <!-- Main Content -->
        <main class="main-container flex-1 px-8 overflow-y-auto">
            <h2 class="text-3xl font-bold mb-8 text-[var(--text-primary)]">Thể Loại Nhạc</h2>

            <!-- THANH LỌC THỂ LOẠI (Dùng Custom CSS Class) -->
            <div class="flex items-center gap-3 overflow-x-auto pb-2 [&::-webkit-scrollbar]:hidden whitespace-nowrap w-full">
                
                <!-- V-Pop -->
                <button class="btn-the-loai">
                    <i class="fa-solid fa-star"></i>
                    <span class="text-sm font-medium">V-Pop</span>
                </button>

                <!-- K-Pop (Có thêm class 'active') -->
                <button class="btn-the-loai active">
                    <i class="fa-solid fa-heart"></i>
                    <span class="text-sm font-bold">K-Pop</span>
                </button>

                <!-- US/UK -->
                <button class="btn-the-loai">
                    <i class="fa-solid fa-globe"></i>
                    <span class="text-sm font-medium">US/UK</span>
                </button>

                <!-- Nhạc trẻ -->
                <button class="btn-the-loai">
                    <i class="fa-solid fa-fire"></i>
                    <span class="text-sm font-medium">Nhạc trẻ</span>
                </button>

                <!-- Chill -->
                <button class="btn-the-loai">
                    <i class="fa-solid fa-mug-hot"></i>
                    <span class="text-sm font-medium">Chill</span>
                </button>

                <!-- Rap Việt -->
                <button class="btn-the-loai">
                    <i class="fa-solid fa-microphone-lines"></i>
                    <span class="text-sm font-medium">Rap Việt</span>
                </button>

                <!-- Ballad -->
                <button class="btn-the-loai">
                    <i class="fa-solid fa-guitar"></i>
                    <span class="text-sm font-medium">Ballad</span>
                </button>

                <!-- EDM -->
                <button class="btn-the-loai">
                    <i class="fa-solid fa-bolt"></i>
                    <span class="text-sm font-medium">EDM</span>
                </button>

                <!-- OST -->
                <button class="btn-the-loai">
                    <i class="fa-solid fa-film"></i>
                    <span class="text-sm font-medium">OST</span>
                </button>

                <!-- Indie -->
                <button class="btn-the-loai">
                    <i class="fa-solid fa-seedling"></i>
                    <span class="text-sm font-medium">Indie</span>
                </button>

            </div>

            <!-- KHU VỰC CHỨA DANH SÁCH BÀI HÁT TƯƠNG ỨNG VỚI THỂ LOẠI -->
            <div id="song-list-container" class="mt-8 grid grid-cols-2 md:grid-cols-4 lg:grid-cols-5 gap-6">
                <!-- JavaScript sẽ tự động bơm các thẻ vuông (Card) bài hát vào đây -->
            </div>

        </main>
    </div>

    <!-- Music Player -->
    <div id="player-placeholder"></div>
    
    <script type="module" src="./assets/javascript/main.js"></script>
    <script type="module" src="./assets/javascript/theloai.js"></script>
    
</body>

</html>
