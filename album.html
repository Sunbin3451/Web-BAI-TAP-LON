<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="referrer" content="no-referrer">
    <title>Bài Tập Lớn - Album Nghệ Sĩ</title>
    <link rel="stylesheet" href="./assets/css/layout.css">
    <link rel="stylesheet" href="./assets/css/album.css">
    <link rel="stylesheet" href="./assets/css/color.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" />
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body>
   <div id="header-container"></div>
       <div class="layout-container flex">
           <div id="sidebar-placeholder"></div>
<main class="main-container flex flex-col w-full p-6 pb-30 overflow-y-auto">
           <div class="mb-6">
    <h2 class="text-3xl font-bold text-white">🎵 Album</h2>
    <p class="text-gray-400 mt-1">
        Khám phá các album nổi bật của các nghệ sĩ.
    </p>
</div>
            <div id="artist-grid"
                class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 xl:grid-cols-5 gap-5 mb-40">
               
            </div>
        </main>
    </div>
<!-- Modal Cài Đặt (Ẩn mặc định) -->
<div id="settings-modal" class="hidden fixed inset-0 bg-black/70 flex items-center justify-center z-50 p-4 backdrop-blur-sm">
    <div class="bg-[#181818] border border-[#282828] text-white w-full max-w-2xl rounded-xl shadow-2xl overflow-hidden flex flex-col max-h-[90vh]">
                <!-- Header Modal -->
        <div class="flex items-center justify-between px-6 py-4 border-b border-[#282828] bg-[#121212]">
            <h3 class="text-lg font-bold flex items-center gap-2">
                <i class="fa-solid fa-user-gear text-green-500"></i> Cài Đặt Tài Khoản
            </h3>
            <button id="btn-close-modal" class="text-gray-400 hover:text-white text-xl p-1 transition">&times;</button>
        </div>
        <div class="flex flex-col md:flex-row flex-1 overflow-hidden">
            <!-- Sidebar Navigation của Modal -->
            <div class="w-full md:w-1/3 bg-[#121212] p-3 border-r border-[#282828] flex flex-col gap-1">
                <button class="tab-btn active text-left px-4 py-2.5 rounded-lg font-medium text-sm transition flex items-center gap-2 bg-[#282828] text-white" data-tab="tab-profile">
                    <i class="fa-solid fa-id-card"></i> Thông tin cá nhân
                </button>
                <button class="tab-btn text-left px-4 py-2.5 rounded-lg font-medium text-sm transition flex items-center gap-2 text-gray-400 hover:bg-[#282828] hover:text-white" data-tab="tab-reset-password">
                    <i class="fa-solid fa-lock"></i> Đặt lại mật khẩu
                </button>
                <button class="tab-btn text-left px-4 py-2.5 rounded-lg font-medium text-sm transition flex items-center gap-2 text-gray-400 hover:bg-[#282828] hover:text-white" data-tab="tab-forgot-password">
                    <i class="fa-solid fa-shield-halved"></i> Quên mật khẩu
                </button>
            </div>
            <!-- Nội dung các Tab -->
            <div class="flex-1 p-6 overflow-y-auto">
                
                <!--: Thông tin tài khoản -->
                <div id="tab-profile" class="tab-content flex flex-col gap-4">
                    <h4 class="font-semibold text-base border-b border-gray-700 pb-2">Thông tin tài khoản</h4>
                    
                    <div class="flex items-center gap-4 my-2">
                        <div class="w-16 h-16 rounded-full bg-purple-600 text-white font-bold text-2xl flex items-center justify-center border-2 border-green-500">
                            L
                        </div>
                        <div>
                            <button class="px-3 py-1.5 bg-[#282828] hover:bg-[#3e3e3e] text-xs rounded-full font-medium transition">Đổi ảnh đại diện</button>
                            <p class="text-xs text-gray-400 mt-1">Hỗ trợ JPG, PNG (Tối đa 2MB)</p>
                        </div>
                    </div>

                    <div>
                        <label class="block text-xs text-gray-400 mb-1">Họ và tên</label>
                        <input type="text" value="Lê Văn A" class="w-full bg-[#282828] border border-gray-700 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-green-500 text-white">
                    </div>

                    <div>
                        <label class="block text-xs text-gray-400 mb-1">Email</label>
                        <input type="email" value="user@gmail.com" disabled class="w-full bg-[#1e1e1e] border border-gray-800 rounded-lg px-3 py-2 text-sm text-gray-500 cursor-not-allowed">
                    </div>

                    <button class="mt-2 w-fit px-5 py-2 bg-green-500 hover:bg-green-600 text-black font-bold text-sm rounded-full transition">Lưu thay đổi</button>
                </div>

                <!--Đổi mật khẩu -->
                <div id="tab-reset-password" class="tab-content hidden flex flex-col gap-4">
                    <h4 class="font-semibold text-base border-b border-gray-700 pb-2">Đặt lại / Đổi mật khẩu</h4>
                    
                    <div>
                        <label class="block text-xs text-gray-400 mb-1">Mật khẩu hiện tại</label>
                        <input type="password" placeholder="••••••••" class="w-full bg-[#282828] border border-gray-700 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-green-500 text-white">
                    </div>

                    <div>
                        <label class="block text-xs text-gray-400 mb-1">Mật khẩu mới</label>
                        <input type="password" placeholder="Tối thiểu 6 ký tự" class="w-full bg-[#282828] border border-gray-700 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-green-500 text-white">
                    </div>

                    <div>
                        <label class="block text-xs text-gray-400 mb-1">Xác nhận mật khẩu mới</label>
                        <input type="password" placeholder="Nhập lại mật khẩu mới" class="w-full bg-[#282828] border border-gray-700 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-green-500 text-white">
                    </div>

                    <button class="mt-2 w-fit px-5 py-2 bg-green-500 hover:bg-green-600 text-black font-bold text-sm rounded-full transition">Cập nhật mật khẩu</button>
                </div>

                <!--: Quên mật khẩu -->
                <div id="tab-forgot-password" class="tab-content hidden flex flex-col gap-4">
                    <h4 class="font-semibold text-base border-b border-gray-700 pb-2">Khôi phục mật khẩu</h4>
                    <p class="text-xs text-gray-400 leading-relaxed">Nhập email đăng ký của bạn. Hệ thống sẽ gửi một mã OTP hoặc liên kết đặt lại mật khẩu về hộp thư.</p>
                    
                    <div>
                        <label class="block text-xs text-gray-400 mb-1">Địa chỉ Email xác nhận</label>
                        <input type="email" placeholder="example@gmail.com" class="w-full bg-[#282828] border border-gray-700 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-green-500 text-white">
                    </div>

                    <button class="mt-2 w-fit px-5 py-2 bg-green-500 hover:bg-green-600 text-black font-bold text-sm rounded-full transition">Gửi yêu cầu khôi phục</button>
                </div>

            </div>
        </div>

    </div>
</div>
    <!-- Music Player -->
    <div id="player-placeholder"></div>
    <script src="./assets/javascript/main.js"></script>
    <script src="./assets/javascript/album.js"></script>
    <script src="./assets/javascript/header.js"></script>  
    <script src="assets/javascript/dataFetch.js"></script>

    
</body>

</html>
