<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Website nghe nhạc trực tuyến đa nền tảng, thiết kế giao diện hiện đại">
    <meta name="keywords"
        content="rap việt, v-pop, vpopmusic, vpop, nghe nhạc, music streaming, playlist, lofi, html5, tailwind css">

    <title>Playlist - Bài Tập Lớn</title>

    <!-- File CSS chung, tránh chỉnh sửa -->
    <link rel="stylesheet" href="./assets/css/layout.css">
    
    <link rel="stylesheet" href="./assets/css/search.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
        integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body>
    <!-- Header -->
    <div id="header-placeholder"></div>

    <div class="layout-container flex">
        <!-- Sidebar -->
        <div id="sidebar-placeholder"></div>

        <!-- Main Content (Làm ở đây) -->
        <main class="main-container flex bg-neutral-900 text-white p-6">
            <div id="playlist-view" class="w-full">
                <div class="flex items-end gap-6 mb-6">
                    <div id="playlistCover" class="w-48 h-48 bg-neutral-800 flex items-center justify-center rounded shadow-lg">
                    <i class="fa-solid fa-music text-5xl text-neutral-400"></i>
                </div>
                <div>
                    <p class="text-sm font-semibold">Danh sách phát công khai</p>
                    <h1 class="text-6xl font-extrabold my-2">Danh Sách Phát</h1>
                    <p class="text-sm text-neutral-300 mt-2 flex items-center gap-1">
                        <span id="playlistCount"></span>
                        <span id="playlistTotalDuration"></span>
                    </p>
                </div>
            </div>

                <div class="flex items-center justify-between border-b border-neutral-700 pb-4 mb-6">
    <div class="flex items-center gap-4 text-neutral-300">
        <button><i class="fa-solid fa-user-plus text-xl"></i></button>
        <button><i class="fa-solid fa-ellipsis text-xl"></i></button>
    </div>
    <button class="flex items-center gap-2 text-sm text-neutral-300">
        Danh sách <i class="fa-solid fa-list"></i>
    </button>
</div>

<!-- ====== Bảng Playlist đầy đủ (hiện ngay khi có bài hát) ====== -->
    <div id="playlistFullView" class="w-full hidden mb-8">
        <table class="w-full text-left">
            <thead>
                <tr class="text-neutral-400 text-xs uppercase border-b border-neutral-800">
                    <th class="py-2 pl-2 w-10">#</th>
                    <th class="py-2">Tiêu đề</th>
                    <th class="py-2 hidden md:table-cell">Nghệ sĩ</th>
                    <th class="py-2 hidden lg:table-cell">Album</th>
                    <th class="py-2 hidden lg:table-cell">Ngày thêm</th>
                    <th class="py-2 pr-4 text-right w-16"><i class="fa-regular fa-clock"></i></th>
                </tr>
            </thead>
            <tbody id="playlistTrackList"></tbody>
        </table>
    </div>

    <div>
        <h3 class="text-2xl font-bold mb-4">Hãy cùng tìm nội dung cho danh sách phát của bạn</h3>
        <div class="relative max-w-xl">
            <i class="fa-solid fa-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-neutral-400"></i>
            <input type="text" id="songSearchInput" placeholder="Tìm bài hát hoặc tác giả "
                    autocomplete="off"
                    class="w-full bg-neutral-800 rounded-full pl-10 pr-4 py-2 text-sm outline-none">
        </div>

        <div id="searchResults" class="max-w-xl mt-2 hidden"></div>
    </div>

<!-- ====== Bảng Playlist đầy đủ (hiện khi có bài hát) ====== -->
   <div id="playlistFullView" class="w-full hidden mt-8">
    <table class="w-full text-left">
        <thead>
            <tr class="text-neutral-400 text-xs uppercase border-b border-neutral-800">
                <th class="py-2 pl-2 w-10">#</th>
                <th class="py-2">Tiêu đề</th>
                <th class="py-2 hidden md:table-cell">Nghệ sĩ</th>
                <th class="py-2 hidden lg:table-cell">Album</th>
                <th class="py-2 hidden lg:table-cell">Ngày thêm</th>
                <th class="py-2 pr-4 text-right w-16"><i class="fa-regular fa-clock"></i></th>
            </tr>
        </thead>
        <tbody id="playlistTrackList"></tbody>
    </table>
</div>
                </div>
            </div>
        </main>
    </div>

    <!-- Music Player -->
    <div id="player-placeholder"></div>

    <script src="./assets/javascript/main.js"></script>
    <script src="./assets/javascript/search.js"></script>
    <script src="./assets/javascript/header.js"></script>  
    <script src="assets/javascript/dataFetch.js"></script>
</body>

</html>
