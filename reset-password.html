<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <title>Đặt lại mật khẩu</title>
    <link rel="stylesheet" href="./assets/css/color.css">
    <link rel="stylesheet" href="./assets/css/setting.css">
</head>

<body style="display:flex; justify-content:center; align-items:center; min-height:100vh;">

    <div class="modal-content" style="max-width:400px;">
        <h2 style="margin-bottom:16px; font-size:20px;">Tạo mật khẩu mới</h2>
        <form id="reset-pwd-form">
            <div class="form-group">
                <label>Mật khẩu mới</label>
                <input type="password" id="new-password" placeholder="Nhập mật khẩu mới" required>
            </div>
            <div class="form-group">
                <label>Xác nhận mật khẩu</label>
                <input type="password" id="confirm-password" placeholder="Nhập lại mật khẩu mới" required>
            </div>
            <button type="submit" class="btn-save" style="width:100%; margin-top:16px;">Xác nhận đặt lại</button>
        </form>
    </div>

    <script>
        const BASE_URL = 'https://myt-lh.konnn04.dev';

        // 1. Lấy token từ URL query parameter
        const urlParams = new URLSearchParams(window.location.search);
        const resetToken = urlParams.get('token');

        if (!resetToken) {
            alert('Token không hợp lệ hoặc đã hết hạn!');
            window.location.href = 'login.html';
        }

        // 2. Gửi API
        document.getElementById('reset-pwd-form').onsubmit = async (e) => {
            e.preventDefault();
            const newPassword = document.getElementById('new-password').value;
            const confirmPassword = document.getElementById('confirm-password').value;

            if (newPassword !== confirmPassword) {
                alert('Mật khẩu xác nhận không khớp!');
                return;
            }

            try {
                const response = await fetch(`${BASE_URL}/api/v1/auth/reset-password`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        token: resetToken,
                        newPassword: newPassword
                    })
                });

                const resData = await response.json();
                if (response.ok && resData.success !== false) {
                    alert('Đặt lại mật khẩu thành công! Vui lòng đăng nhập lại.');
                    window.location.href = 'login.html';
                } else {
                    alert(resData.message || 'Link đổi mật khẩu đã hết hạn (chỉ có hiệu lực 10 phút).');
                }
            } catch (err) {
                alert('Lỗi kết nối máy chủ!');
            }
        };
    </script>
</body>

</html>
