<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đặt lại mật khẩu</title>
    <link rel="stylesheet" href="./assets/css/color.css">
    <link rel="stylesheet" href="./assets/css/auth.css">
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="reset-page__bg">

    <div class="reset-page__container">
        <div class="reset-card">
            <h2 class="reset-card__title">Tạo mật khẩu mới</h2>
            <form id="reset-pwd-form" class="reset-form">
                <div class="form-group">
                    <label class="form-label" for="new-password">Mật khẩu mới</label>
                    <input type="password" id="new-password" class="form-input" placeholder="Nhập mật khẩu mới" required
                        minlength="6">
                </div>
                <div class="form-group">
                    <label class="form-label" for="confirm-password">Xác nhận mật khẩu</label>
                    <input type="password" id="confirm-password" class="form-input" placeholder="Nhập lại mật khẩu mới"
                        required minlength="6">
                </div>
                <button type="submit" id="btn-submit-reset" class="reset-submit-btn">
                    Xác nhận đặt lại
                </button>
            </form>
        </div>
    </div>

    <script src="./assets/javascript/reset-password.js"></script>
</body>

</html>
