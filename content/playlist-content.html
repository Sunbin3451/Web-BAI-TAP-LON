<div id="playlist-view" class="playlist__container-wrap w-full">
    <div class="playlist__hero flex items-end gap-6 mb-6">
        <div id="playlistCover"
            class="playlist__cover w-48 h-48 bg-neutral-800 flex items-center justify-center rounded shadow-lg">
            <i class="fa-solid fa-music text-5xl text-neutral-400"></i>
        </div>
        <div>
            <p class="text-sm font-semibold">Danh sách phát công khai</p>
            <h1 class="playlist__title text-6xl font-extrabold my-2">Danh Sách Phát</h1>
            <p class="playlist__meta text-sm text-neutral-300 mt-2 flex items-center gap-1">
                <span id="playlistCount"></span>
                <span id="playlistTotalDuration"></span>
            </p>
        </div>
    </div>

    <div class="playlist__controls flex items-center justify-between border-b border-neutral-700 pb-4 mb-6">
        <div class="flex items-center gap-4 text-neutral-300">
            <button><i class="fa-solid fa-user-plus text-xl"></i></button>
            <button><i class="fa-solid fa-ellipsis text-xl"></i></button>
        </div>
        <button class="flex items-center gap-2 text-sm text-neutral-300">
            Danh sách <i class="fa-solid fa-list"></i>
        </button>
    </div>

    <!-- Bảng playlist đã lưu -->
    <div id="playlistFullView" class="playlist__table-wrap w-full hidden mb-8">
        <table class="playlist__table w-full text-left">
            <thead>
                <tr class="playlist__table-head text-neutral-400 text-xs uppercase border-b border-neutral-800">
                    <th class="py-2 pl-2 w-10">#</th>
                    <th class="py-2">Tiêu đề</th>
                    <th class="py-2 hidden md:table-cell">Nghệ sĩ</th>
                    <th class="py-2 hidden lg:table-cell">Album</th>
                    <th class="py-2 hidden lg:table-cell">Ngày thêm</th>
                    <th class="py-2 pr-4 text-right w-16"><i class="fa-regular fa-clock"></i></th>
                </tr>
            </thead>
            <tbody id="playlistTrackList" class="playlist__table-body"></tbody>
        </table>
    </div>

    <div>
        <h3 class="text-2xl font-bold mb-4">Hãy cùng tìm nội dung cho danh sách phát của bạn</h3>
        <div class="playlist__search relative max-w-xl">
            <i class="fa-solid fa-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-neutral-400"></i>
            <input type="text" id="songSearchInput"
                class="playlist__search-input w-full bg-neutral-800 rounded-full pl-10 pr-4 py-2 text-sm outline-none"
                placeholder="Tìm bài hát hoặc tác giả" autocomplete="off">
        </div>

        <div id="searchResults" class="playlist__search-results max-w-xl mt-2 hidden"></div>
    </div>
</div>
