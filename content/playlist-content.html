<div id="playlist-view" class="playlist__container-wrap w-full px-3 sm:px-6">
    <div class="playlist__hero flex items-center gap-3 sm:gap-4 mb-4 mt-2">
        <div id="playlistCover"
            class="playlist__cover w-20 h-20 sm:w-24 sm:h-24 md:w-28 md:h-28 bg-neutral-800 flex items-center justify-center rounded shadow-lg flex-shrink-0">
            <i class="fa-solid fa-music text-xl sm:text-2xl text-neutral-400"></i>
        </div>
        <div class="min-w-0">
            <h1 class="playlist__title text-lg sm:text-2xl md:text-3xl font-extrabold my-1 truncate">Danh Sách Phát</h1>
            <p class="playlist__meta text-xs text-neutral-300 mt-1 flex items-center gap-1 flex-wrap">
                <span id="playlistCount"></span>
                <span id="playlistTotalDuration"></span>
            </p>
        </div>
    </div>

    <div class="playlist__controls flex items-center justify-between border-b border-neutral-700 pb-3 mb-4">
        <div class="flex items-center gap-3 sm:gap-4 text-neutral-300">
            <button><i class="fa-solid fa-user-plus text-lg sm:text-xl"></i></button>
            <button><i class="fa-solid fa-ellipsis text-lg sm:text-xl"></i></button>
        </div>
        <button class="flex items-center gap-2 text-xs sm:text-sm text-neutral-300">
            <span class="hidden sm:inline">Danh sách</span> <i class="fa-solid fa-list"></i>
        </button>
    </div>

    <!-- Bảng playlist đã lưu -->
    <div id="playlistFullView" class="playlist__table-wrap w-full hidden mb-6 overflow-x-auto">
        <table class="playlist__table w-full text-left min-w-[480px]">
            <thead>
                <tr class="playlist__table-head text-neutral-400 text-xs uppercase border-b border-neutral-800">
                    <th class="py-2 pl-2 w-8 sm:w-10">#</th>
                    <th class="py-2">Tiêu đề</th>
                    <th class="py-2 hidden md:table-cell">Nghệ sĩ</th>
                    <th class="py-2 hidden lg:table-cell">Album</th>
                    <th class="py-2 hidden lg:table-cell">Ngày thêm</th>
                    <th class="py-2 pr-2 sm:pr-4 text-right w-14 sm:w-16"><i class="fa-regular fa-clock"></i></th>
                </tr>
            </thead>
            <tbody id="playlistTrackList" class="playlist__table-body"></tbody>
        </table>
    </div>

    <div>
        <h3 class="text-base sm:text-2xl font-bold mb-3 sm:mb-4">Hãy cùng tìm nội dung cho danh sách phát của bạn</h3>
        <div class="playlist__search relative w-full max-w-xl">
            <i
                class="fa-solid fa-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-neutral-400 text-sm"></i>
            <input type="text" id="songSearchInput"
                class="playlist__search-input w-full bg-neutral-800 rounded-full pl-9 sm:pl-10 pr-4 py-2 text-xs sm:text-sm outline-none"
                placeholder="Tìm bài hát hoặc tác giả" autocomplete="off">
        </div>

        <div id="searchResults" class="playlist__search-results w-full max-w-xl mt-2 hidden"></div>
    </div>
</div>
