<div id="playlist-view" class="playlist__container">

    <!-- ================= VIEW DANH SÁCH PLAYLIST ================= -->
    <div id="playlist-grid-view" class="playlist__grid-view">
        <h2 class="playlist__section-title">Playlist của bạn</h2>

        <div id="playlist-cards-container" class="playlist__grid">
            <!-- Card Tạo Playlist mới -->
            <div id="btn-open-create-modal" class="playlist__create-card">
                <div class="playlist__create-icon">
                    <i class="fa-solid fa-plus"></i>
                </div>
                <span class="playlist__create-text">Tạo playlist mới</span>
            </div>

            <!-- Các Playlist Cards render tự động vào đây -->
        </div>
    </div>

    <!-- ================= VIEW CHI TIẾT PLAYLIST ================= -->
    <div id="playlist-detail-view" class="playlist__detail-view hidden">
        <button id="btn-back-to-playlists" class="playlist__back-btn">
            <i class="fa-solid fa-arrow-left"></i>
            <span>Quay lại</span>
        </button>

        <div class="playlist__hero">
            <div id="detail-playlist-cover" class="playlist__hero-cover">
                <i class="fa-solid fa-music"></i>
            </div>

            <div class="playlist__hero-info">
                <span class="playlist__hero-tag">Playlist của bạn</span>
                <h1 id="detail-playlist-name" class="playlist__hero-title">Tên Playlist</h1>
                <p id="detail-playlist-count" class="playlist__hero-meta">0 bài hát</p>

                <div class="playlist__hero-actions">
                    <button id="btn-play-all-playlist" class="playlist__btn-play">
                        <i class="fa-solid fa-play"></i> Phát tất cả
                    </button>
                </div>
            </div>
        </div>

        <div class="playlist__track-container">
            <div id="detail-songs-list" class="playlist__track-list">
                <!-- Danh sách bài hát render tự động -->
            </div>

            <div id="detail-empty-songs" class="playlist__empty-state hidden">
                <i class="fa-solid fa-compact-disc playlist__empty-icon"></i>
                <p class="playlist__empty-text">Playlist này chưa có bài hát nào.</p>
            </div>
        </div>
    </div>

    <!-- ================= POPUP MODAL TẠO PLAYLIST ================= -->
    <div id="create-playlist-modal" class="playlist__modal-overlay hidden">
        <div class="playlist__modal">
            <h3 class="playlist__modal-title">Tạo playlist mới</h3>
            <p class="playlist__modal-subtitle">Tạo danh sách phát cá nhân để lưu giữ những bài hát bạn yêu thích.</p>

            <div class="playlist__modal-group">
                <label class="playlist__modal-label">Tên playlist</label>
                <input type="text" id="input-playlist-name" class="playlist__modal-input" placeholder="Playlist của tôi"
                    autocomplete="off">
            </div>

            <div class="playlist__modal-actions">
                <button id="btn-cancel-create" class="playlist__modal-btn-cancel">Huỷ</button>
                <button id="btn-confirm-create" class="playlist__modal-btn-confirm">Tạo</button>
            </div>
        </div>
    </div>

</div>
