<div id="album-detail" class="w-full">

    <div class="mb-4">
        <a href="#" data-page="album" class="back-link">
            <i class="fa-solid fa-arrow-left"></i>
            Quay lại danh sách Album
        </a>
    </div>

    <!-- THÔNG TIN ALBUM -->
    <div class="album-header">
        <img id="album-cover" src="" alt="Cover" class="album-cover-img" />

        <div class="album-info">
            <span class="album-badge">ALBUM </span>
            <h2 id="album-title" class="album-title">Đang tải...</h2>

            <p class="album-meta">
                Thể loại: <span id="album-genre" class="highlight-text"></span>
                • Nghệ sĩ: <span id="artist-header-name" class="highlight-text"></span>
            </p>

            <button id="play-all-btn" type="button" class="btn-play-all">
                <i class="fa-solid fa-play"></i>
                PHÁT TẤT CẢ
            </button>
        </div>
    </div>

    <!-- DANH SÁCH BÀI HÁT -->
    <div class="table-container">
        <table class="song-table">
            <thead>
                <tr class="song-table-header">
                    <th class="th-num">#</th>
                    <th class="th-title">Bài hát</th>
                    <th class="th-time"><i class="fa-regular fa-clock"></i></th>
                </tr>
            </thead>
            <tbody id="song-list" class="song-table-body"></tbody>
        </table>
    </div>

</div>
