<div class="flex flex-col w-full p-6 overflow-y-auto">
    <div class="mb-6 border-b border-gray-800 pb-2">
        <h2 class="text-xl font-bold text-[#39C]">ALBUM</h2>
    </div>

    <!-- Lưới chứa danh sách nghệ sĩ -->
    <div id="artist-grid"
        class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 xl:grid-cols-5 gap-5 mb-40">
        <!-- JavaScript sẽ tự động điền các ô nghệ sĩ vào vị trí này -->
    </div>
</div>

<script>
    // BƯỚC 1: Khai báo danh sách (Mảng) chứa thông tin của 20 nghệ sĩ
    // Mỗi nghệ sĩ gồm có: mã định danh (id), tên hiển thị (name), và đường dẫn ảnh (img)
    const artists = [
        // V-Pop
        { id: "sontung", name: "Sơn Tùng M-TP", img: "images/sontung.jpg", category: "vpop" },
        { id: "hieuthuhai", name: "HIEUTHUHAI", img: "images/hieuthuhai.jpg", category: "vpop" },
        { id: "denvau", name: "Đen Vâu", img: "images/denvau.jpg", category: "vpop" },
        { id: "tlinh", name: "tlinh", img: "images/tlinh.jpg", category: "vpop" },
        { id: "vu", name: "Vũ.", img: "images/vu.jpg", category: "vpop" },
        { id: "mytam", name: "Mỹ Tâm", img: "images/mytam.jpg", category: "vpop" },

        // K-Pop
        { id: "bts", name: "BTS", img: "images/bts.jpg", category: "kpop" },
        { id: "blackpink", name: "BLACKPINK", img: "images/blackpink.jpg", category: "kpop" },
        { id: "newjeans", name: "NewJeans", img: "images/newjeans.jpg", category: "kpop" },

        // US/UK
        { id: "taylorswift", name: "Taylor Swift", img: "images/taylor.jpg", category: "usuk" },
        { id: "brunomars", name: "Bruno Mars", img: "images/bruno.jpg", category: "usuk" },
        { id: "theweeknd", name: "The Weeknd", img: "images/weeknd.jpg", category: "usuk" },

        // Rap Việt
        { id: "mck", name: "RPT MCK", img: "images/mck.jpg", category: "rap" },
        { id: "karik", name: "Karik", img: "images/karik.jpg", category: "rap" },

        // Nhạc trẻ
        { id: "amee", name: "AMEE", img: "images/amee.jpg", category: "nhactre" },
        { id: "erik", name: "Erik", img: "images/erik.jpg", category: "nhactre" },

        // Ballad
        { id: "haanhtuan", name: "Hà Anh Tuấn", img: "images/haanhtuan.jpg", category: "ballad" },

        // EDM
        { id: "alanwalker", name: "Alan Walker", img: "images/alanwalker.jpg", category: "edm" },

        // Indie / Chill
        { id: "ngot", name: "Ngọt", img: "images/ngot.jpg", category: "indie" },
        { id: "chillies", name: "Chillies", img: "images/chillies.jpg", category: "chill" }
    ];

    // BƯỚC 2: Tìm và lấy ra cái khung HTML (div) có id là "artist-grid" để chuẩn bị đổ dữ liệu vào
    const grid = document.getElementById("artist-grid");

    // BƯỚC 3: Sử dụng vòng lặp "for...of" (Cách lặp cơ bản và dễ hiểu nhất trong JavaScript)
    // Vòng lặp này sẽ chạy qua lần lượt từng nghệ sĩ trong danh sách phía trên
    for (let artist of artists) {

        // Với mỗi nghệ sĩ, ta tạo ra một đoạn code HTML khung hiển thị tương ứng
        // Đoạn này dùng dấu nháy ngược ` ` (Backtick) để truyền biến ${...} trực tiếp vào HTML dễ dàng
        let artistCardHtml = `
            <div class="bg-white/5 p-4 rounded-xl text-center hover:bg-white/10 hover:-translate-y-1 transition-all duration-300">
                <!-- Ảnh của nghệ sĩ -->
                <a href="album-detail.html?artist=${artist.id}">
                    <img src="${artist.img}" alt="${artist.name}" class="w-full h-44 object-cover rounded-lg mb-3" />
                </a>
                <!-- Tên đậm của nghệ sĩ dưới ảnh -->
                <p class="text-base md:text-lg font-bold text-gray-100 tracking-wide line-clamp-1">
                    <a href="album-detail.html?artist=${artist.id}" class="hover:text-[#39C] transition-colors duration-200">
                        ${artist.name}
                    </a>
                </p>
            </div>
        `;

        // Cộng dồn đoạn HTML vừa tạo vào bên trong cái lưới hiển thị bằng phép cộng "+="
        grid.innerHTML += artistCardHtml;
    }
</script>
