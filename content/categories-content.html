<div class="flex-1 px-4 sm:px-8 overflow-y-auto">
    <h2 class="text-2xl sm:text-3xl font-bold mb-6 sm:mb-8 text-[var(--text-primary)]">Thể Loại Nhạc</h2>

    <!-- THANH LỌC THỂ LOẠI -->
    <div class="flex items-center gap-2 sm:gap-3 overflow-x-auto pt-2 pb-2 -mt-2 [&::-webkit-scrollbar]:hidden whitespace-nowrap w-full">

        <!-- V-Pop -->
        <button class="btn-the-loai flex-shrink-0">
            <i class="fa-solid fa-star text-xs sm:text-base"></i>
            <span class="text-xs sm:text-sm font-medium">V-Pop</span>
        </button>

        <!-- K-Pop (active) -->
        <button class="btn-the-loai active flex-shrink-0">
            <i class="fa-solid fa-heart text-xs sm:text-base"></i>
            <span class="text-xs sm:text-sm font-bold">K-Pop</span>
        </button>

        <!-- US/UK -->
        <button class="btn-the-loai flex-shrink-0">
            <i class="fa-solid fa-globe text-xs sm:text-base"></i>
            <span class="text-xs sm:text-sm font-medium">US/UK</span>
        </button>

        <!-- Nhạc trẻ -->
        <button class="btn-the-loai flex-shrink-0">
            <i class="fa-solid fa-fire text-xs sm:text-base"></i>
            <span class="text-xs sm:text-sm font-medium">Nhạc trẻ</span>
        </button>

        <!-- Chill -->
        <button class="btn-the-loai flex-shrink-0">
            <i class="fa-solid fa-mug-hot text-xs sm:text-base"></i>
            <span class="text-xs sm:text-sm font-medium">Chill</span>
        </button>

        <!-- Rap Việt -->
        <button class="btn-the-loai flex-shrink-0">
            <i class="fa-solid fa-microphone-lines text-xs sm:text-base"></i>
            <span class="text-xs sm:text-sm font-medium">Rap Việt</span>
        </button>

        <!-- Ballad -->
        <button class="btn-the-loai flex-shrink-0">
            <i class="fa-solid fa-guitar text-xs sm:text-base"></i>
            <span class="text-xs sm:text-sm font-medium">Ballad</span>
        </button>

        <!-- EDM -->
        <button class="btn-the-loai flex-shrink-0">
            <i class="fa-solid fa-bolt text-xs sm:text-base"></i>
            <span class="text-xs sm:text-sm font-medium">EDM</span>
        </button>

        <!-- OST -->
        <button class="btn-the-loai flex-shrink-0">
            <i class="fa-solid fa-film text-xs sm:text-base"></i>
            <span class="text-xs sm:text-sm font-medium">OST</span>
        </button>

        <!-- Indie -->
        <button class="btn-the-loai flex-shrink-0">
            <i class="fa-solid fa-seedling text-xs sm:text-base"></i>
            <span class="text-xs sm:text-sm font-medium">Indie</span>
        </button>

    </div>
    
    <!-- KHU VỰC LƯỚI BÀI HÁT: 2 cột (Mobile) -> 3 cột (Tablet) -> 4-5 cột (Desktop) -->
    <div id="song-list-container" class="mt-6 sm:mt-8 grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-3 sm:gap-6">
        <!-- JavaScript sẽ tự động render bài hát vào đây -->
    </div>
</div>
