                    <td class="py-4 pl-4 text-center text-gray-500 group-hover:text-[#39C]">${index + 1}</td>
                    <td class="py-2 pl-4 font-medium flex items-center gap-3">
                        <div class="relative w-10 h-10 shrink-0">
                            <img src="${randomThumb}" class="w-full h-full object-cover rounded-md" />
                            <div class="absolute inset-0 bg-black/50 flex items-center justify-center opacity-0 group-hover:opacity-100 transition-opacity rounded-md">
                                <i class="fa-solid fa-play text-xs text-[#39C]"></i>
                            </div>
                        </div>
                        <div>
                            <p class="text-gray-200 group-hover:text-[#39C]">${song.title}</p>
                            <p class="text-xs text-gray-500">${currentArtist.name}</p>
                        </div>
                    </td>
                    <td class="py-4 pr-4 text-right text-gray-400">${randomMin}:${randomSec}</td>
                </tr>
            `;
        });
        songListBody.innerHTML = finalHtml;
    </script>
</body>
</html>
